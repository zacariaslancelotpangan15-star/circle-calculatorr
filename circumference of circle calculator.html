
<html>
<head>
    <title>Circumference Calculator</title>
</head>
<body>

    <h2>Circumference of a Circle Calculator</h2>

    <label>Guess ka number beh:</label>
    <input type="number" id="radius">
    <br><br>

    <button onclick="calculate()">pindutin mo to beh</button>

    <p id="result"></p>

    <script>
        function calculate() {
            let r = document.getElementById("radius").value;

            if (r === "") {
                document.getElementById("result").innerText =
                    "Please enter a radius.";
                return;
            }

            let circumference = 2 * Math.PI * r;
            document.getElementById("result").innerText =
                "Circumference = " + circumference;
        }
    </script>

</body>
</html>
